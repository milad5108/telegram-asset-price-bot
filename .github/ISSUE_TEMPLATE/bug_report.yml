name: Bug Report
description: Report a reproducible bug.
title: "[Bug]: "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happened?
      placeholder: A clear description...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Project version
      placeholder: v1.0.0

  - type: dropdown
    id: operating_system
    attributes:
      label: Operating System
      options:
        - Windows
        - Linux
        - macOS
        - Other